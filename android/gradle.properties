org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Mode de transition officiel de Flutter 3.44+ avec AGP 9 : certains plugins (flutter_tts, flutter_web_auth_2…) appliquent
# encore le Kotlin Gradle Plugin et ne compilent pas avec le Kotlin intégré d'AGP. Voir
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
# Pour passer au Kotlin intégré (Flutter 3.47+) : mettre android.builtInKotlin=true ET retirer id("kotlin-android")
# de android/app/build.gradle.kts, une fois qu'aucun plugin ne signale plus l'ancien KGP à la compilation.
android.builtInKotlin=false
android.newDsl=false
# Un plugin qui cible encore la JVM 1.8 pour Kotlin ne doit pas faire échouer la compilation (Java est relevé à 17 dans build.gradle.kts).
kotlin.jvm.target.validation.mode=warning
