workflows:
  strasse-build:
    name: STRASSE - Android and iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    # pubspec.yaml, android/, ios/ et tool/ sont à la racine du dépôt.
    working_directory: .

    environment:
      flutter: stable
      java: 21
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate missing platforms
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create --org fr.strasse --project-name strasse --platforms=android .
          fi

          # Generate the iOS host project in a temporary Flutter app.
          # Never run flutter create --overwrite at the repository root:
          # it can replace project-owned files and is not needed to create Runner.xcodeproj.
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            temp_dir="$(mktemp -d)"
            if [ -f ios/Runner/AppDelegate.swift ]; then
              cp ios/Runner/AppDelegate.swift "$temp_dir/AppDelegate.swift"
            fi
            flutter create --org fr.strasse --project-name strasse --platforms=ios "$temp_dir/strasse"
            rm -rf ios
            cp -R "$temp_dir/strasse/ios" ios
            if [ -f "$temp_dir/AppDelegate.swift" ]; then
              cp "$temp_dir/AppDelegate.swift" ios/Runner/AppDelegate.swift
            fi
            rm -rf "$temp_dir"
          fi

      - name: Configure native permissions and app names
        script: python3 tool/patch_platforms.py

      - name: Install dependencies
        script: flutter pub get

      - name: Build Android APK
        script: |
          set -e
          DEFINES=()
          for NAME in STRASSE_ENV STRASSE_API_URL STRASSE_TILES_URL STRASSE_TILES_ATTRIBUTION STRASSE_GLYPHS_URL STRASSE_MAP_FONT STRASSE_VALHALLA_URL STRASSE_GEOCODER_URL STRASSE_OTP_URL STRASSE_OVERPASS_URL STRASSE_SUPABASE_URL STRASSE_SUPABASE_ANON_KEY STRASSE_OPENTRIPMAP_KEY STRASSE_SPOTIFY_CLIENT_ID STRASSE_YOUTUBE_IOS_CLIENT_ID STRASSE_YOUTUBE_SERVER_CLIENT_ID STRASSE_GOOGLE_PLACES_API_KEY STRASSE_CONTACT; do
            VALUE="$(printenv "$NAME" || true)"
            if [ -n "$VALUE" ]; then
              DEFINES+=("--dart-define=$NAME=$VALUE")
            fi
          done
          flutter build apk --release "${DEFINES[@]}"

      - name: Build iOS
        script: |
          set -e
          DEFINES=()
          for NAME in STRASSE_ENV STRASSE_API_URL STRASSE_TILES_URL STRASSE_TILES_ATTRIBUTION STRASSE_GLYPHS_URL STRASSE_MAP_FONT STRASSE_VALHALLA_URL STRASSE_GEOCODER_URL STRASSE_OTP_URL STRASSE_OVERPASS_URL STRASSE_SUPABASE_URL STRASSE_SUPABASE_ANON_KEY STRASSE_OPENTRIPMAP_KEY STRASSE_SPOTIFY_CLIENT_ID STRASSE_YOUTUBE_IOS_CLIENT_ID STRASSE_YOUTUBE_SERVER_CLIENT_ID STRASSE_GOOGLE_PLACES_API_KEY STRASSE_CONTACT; do
            VALUE="$(printenv "$NAME" || true)"
            if [ -n "$VALUE" ]; then
              DEFINES+=("--dart-define=$NAME=$VALUE")
            fi
          done
          flutter build ios --release --no-codesign "${DEFINES[@]}"

      - name: Package unsigned IPA
        script: |
          set -e
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr STRASSE-unsigned.ipa Payload

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - STRASSE-unsigned.ipa
