workflows:
  strasse-build:
    name: STRASSE - Android and iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    # pubspec.yaml, android/, ios/ et tool/ sont à la racine du dépôt.
    working_directory: .

    environment:
      flutter: stable
      java: 21
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate missing platforms
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create --org fr.strasse --project-name strasse --platforms=android .
          fi

          # Flutter needs the Xcode project, not merely an ios/ directory.
          # The repository may contain iOS assets/configuration without the
          # generated Runner.xcodeproj; recreate the native iOS scaffold then
          # reapply Strasse-specific settings in the next step.
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --org fr.strasse --project-name strasse --platforms=ios --overwrite .
          fi

      - name: Configure native permissions and app names
        script: python3 tool/patch_platforms.py

      - name: Install dependencies
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

      - name: Build iOS
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr STRASSE-unsigned.ipa Payload

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - STRASSE-unsigned.ipa
