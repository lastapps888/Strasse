workflows:
  strasse-build:
    name: STRASSE - Android and iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    working_directory: strasse

    environment:
      flutter: stable
      java: 21
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate missing platforms
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android,web .
          fi

          if [ ! -d ios ]; then
            flutter create --platforms=ios,web .
          fi

      - name: Configure native permissions and app names
        script: python3 scripts/configure_platforms.py

      - name: Install dependencies
        script: flutter pub get

      - name: Generate Strasse launcher icons
        script: dart run launcher_icons -c .

      - name: Build Android APK
        script: flutter build apk --release

      - name: Build iOS
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr STRASSE-unsigned.ipa Payload

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - STRASSE-unsigned.ipa
