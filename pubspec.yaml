name: strasse
description: "Strasse : navigation GPS gratuite, sans publicité, respectueuse de la vie privée."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et architecture
  flutter_riverpod: ^2.5.1

  # Cartographie, position, voix
  maplibre_gl: ^0.27.1
  geolocator: ^13.0.1
  flutter_tts: ^4.0.2
  wakelock_plus: ^1.2.8

  # Réseau et stockage
  dio: ^5.7.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  disk_space_plus: ^0.2.4

  # Système
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  dynamic_color: ^1.7.0
  uuid: ^4.5.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/logo/png/
