name: strasse
description: "Strasse : navigation GPS gratuite, sans publicité, respectueuse de la vie privée."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et architecture
  flutter_riverpod: ^2.5.1

  # Cartographie, position, voix
  maplibre_gl: ^0.27.1
  geolocator: ^13.0.1
  flutter_tts: ^4.0.2
  # 1.8.1 introduced dbus ^0.8, incompatible with connectivity_plus 6.x (nm/dbus 0.7).
  wakelock_plus: 1.8.0

  # Réseau et stockage
  dio: ^5.7.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.4
  disk_space_plus: ^0.2.4

  # Système
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.5
  flutter_local_notifications: ^22.3.3
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  dynamic_color: ^1.7.0
  uuid: ^4.5.0
  crypto: ^3.0.5
  cryptography: ^2.7.0

  # Réservation (WebView intégrée), sélecteur de fichiers, musique
  webview_flutter: ^4.10.0
  file_picker: ^13.4.0
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  flutter_web_auth_2: ^4.1.0
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  home_widget_generator: ^0.1.0
  home_widget_cli: ^0.1.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/logo/png/
    - assets/app_icons/
    - assets/i18n/
