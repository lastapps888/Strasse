name: Changed application files archive

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changed-files-archive:
    name: Package only changed Strasse files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create ZIP with original directory structure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import zipfile

          root = pathlib.Path.cwd()
          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          excluded = {".github/workflows/changed-files-archive.yml"}

          result = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMRT", f"{base_sha}...{head_sha}"],
              cwd=root,
              check=True,
              capture_output=True,
              text=True,
          )
          paths = [
              pathlib.PurePosixPath(line.strip())
              for line in result.stdout.splitlines()
              if line.strip() and line.strip() not in excluded
          ]
          if not paths:
              raise SystemExit("No changed application files were found.")

          archive = root / "Strasse-1.0.0-stabilize-1.0.0-changed-files.zip"
          written = []
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for relative in paths:
                  source = root.joinpath(*relative.parts)
                  if not source.is_file():
                      raise SystemExit(f"Changed file is missing: {relative}")
                  output.write(source, arcname=relative.as_posix())
                  written.append(relative.as_posix())

          with zipfile.ZipFile(archive, "r") as check:
              names = check.namelist()
              if names != written:
                  raise SystemExit("ZIP verification failed: archived paths differ from selected paths.")
              if any(name.startswith("/") or ".." in pathlib.PurePosixPath(name).parts for name in names):
                  raise SystemExit("ZIP verification failed: unsafe archive path.")

          print(f"Created and verified {archive.name} with {len(written)} changed files:")
          print("\n".join(written))
          PY

      - name: Upload changed files ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Strasse-1.0.0-stabilize-1.0.0-changed-files
          path: Strasse-1.0.0-stabilize-1.0.0-changed-files.zip
          if-no-files-found: error
          retention-days: 30
